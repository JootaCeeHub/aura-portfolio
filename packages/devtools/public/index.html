<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AURA Devtools</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #0f172a;
            color: #e2e8f0;
        }
        .container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            height: 100vh;
            gap: 1px;
            background: #1e293b;
        }
        .panel {
            overflow: auto;
            padding: 1rem;
            background: #1e293b;
        }
        .panel h2 {
            color: #06b6d4;
            margin-bottom: 1rem;
            font-size: 1.2em;
        }
        .event-item {
            background: #0f172a;
            padding: 0.5rem;
            margin: 0.5rem 0;
            border-left: 3px solid #06b6d4;
            border-radius: 4px;
            font-size: 0.9em;
        }
        .event-type {
            color: #fbbf24;
            font-weight: bold;
        }
        .event-detail {
            color: #94a3b8;
            font-size: 0.85em;
            margin-top: 0.25rem;
        }
        .agent-card {
            background: #0f172a;
            padding: 0.75rem;
            margin: 0.5rem 0;
            border-radius: 4px;
            border: 1px solid #334155;
        }
        .agent-name {
            color: #06b6d4;
            font-weight: bold;
        }
        .agent-status {
            display: inline-block;
            padding: 0.25rem 0.5rem;
            border-radius: 3px;
            font-size: 0.8em;
            margin-top: 0.25rem;
        }
        .status-healthy { background: #10b981; color: #000; }
        .status-executing { background: #f59e0b; color: #000; }
        .status-error { background: #ef4444; color: #fff; }
    </style>
</head>
<body>
    <div class="container">
        <!-- Events & Logs -->
        <div class="panel">
            <h2>📊 Events & Logs</h2>
            <div id="events-container"></div>
        </div>

        <!-- Agents & Metrics -->
        <div class="panel">
            <h2>🤖 Agents & Metrics</h2>
            <div id="agents-container"></div>
            <div id="metrics-container" style="margin-top: 2rem;">
                <h3 style="color: #64748b; font-size: 0.95em;">Metrics</h3>
                <p id="metrics-text" style="color: #94a3b8; font-size: 0.9em;"></p>
            </div>
        </div>
    </div>

    <script>
        const ws = new WebSocket(`ws://${window.location.host}`);
        const eventsContainer = document.getElementById('events-container');
        const agentsContainer = document.getElementById('agents-container');
        const metricsText = document.getElementById('metrics-text');

        ws.onmessage = (event) => {
            const message = JSON.parse(event.data);
            if (message.type === 'event') {
                addEvent(message.data);
            } else if (message.type === 'log') {
                addLog(message.data);
            }
        };

        function addEvent(event) {
            const item = document.createElement('div');
            item.className = 'event-item';
            item.innerHTML = `
                <div class="event-type">${event.type}</div>
                <div class="event-detail">
                    ${event.agentId ? `Agent: ${event.agentId}` : ''}
                    ${event.latencyMs ? ` | Latency: ${event.latencyMs}ms` : ''}
                    ${event.success !== undefined ? ` | Success: ${event.success}` : ''}
                </div>
            `;
            eventsContainer.prepend(item);
            if (eventsContainer.children.length > 20) {
                eventsContainer.removeChild(eventsContainer.lastChild);
            }
        }

        function addLog(log) {
            // Similar a eventos
        }

        // Cargar datos iniciales
        fetch('/api/agents').then(r => r.json()).then(agents => {
            agentsContainer.innerHTML = agents.map(a => `
                <div class="agent-card">
                    <div class="agent-name">${a.name}</div>
                    <span class="agent-status status-${a.status}">${a.status}</span>
                </div>
            `).join('');
        });

        fetch('/api/metrics').then(r => r.json()).then(m => {
            metricsText.innerHTML = `
                Executions: ${m.totalExecutions} |
                Active: ${m.activeAgents} |
                Error Rate: ${(m.errorRate * 100).toFixed(1)}%
            `;
        });
    </script>
</body>
</html>
